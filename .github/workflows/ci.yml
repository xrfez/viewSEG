name: CI

on:
  push:
    branches: [ main, phase1 ]
    paths:
      - '**'
      - '!**.md'
  pull_request:
    branches: [ main ]
    paths:
      - '**'
      - '!**.md'
  workflow_dispatch:     # the "Run workflow" button

# A new push cancels the run still going for the same branch or pull request.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # the test step alone takes about 55 minutes on 4 cores
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GUI build libraries, xvfb and SDL 3.4.18 from source: keep in step with
      # the nim-dev image the devcontainer uses (Ubuntu and Debian ship no SDL 3.4).
      # Mesa's llvmpipe (libgl1-mesa-dri; libgl-dev and libegl-dev bring its GLX
      # and EGL) draws under Xvfb; dbus-daemon gives the tray tests a session bus
      # of their own (they skip those parts without it). Every name is in both
      # Ubuntu 24.04 and 26.04 (ubuntu-latest moves to 26.04). No libpcre: 26.04
      # has no PCRE1, and nothing here uses std/re or std/nre (tests/tlayers).
      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb xauth libgl1-mesa-dri dbus-daemon cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxinerama-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            libdecor-0-dev libegl-dev libgl-dev libgles-dev libdbus-1-dev libudev-dev

      # SDL3 built on one Ubuntu release is not reused on the next.
      - name: Name the runner's release
        id: release
        run: echo "id=$(. /etc/os-release && echo "$ID-$VERSION_ID")" >> "$GITHUB_OUTPUT"

      - name: Cache SDL3
        id: sdl3-cache
        uses: actions/cache@v4
        with:
          path: ~/sdl3
          key: sdl3-3.4.18-${{ steps.release.outputs.id }}-${{ runner.arch }}-v1

      # Static and shared, like the image. config.nims takes SDL's headers and
      # libSDL3.a from pkg-config (this prefix is not a default include path),
      # so the tests need no libSDL3.so at run time.
      - name: Build SDL3
        if: steps.sdl3-cache.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 --branch release-3.4.18 \
            https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL"
          cmake -S "$RUNNER_TEMP/SDL" -B "$RUNNER_TEMP/SDL/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/sdl3" \
            -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DSDL_SHARED=ON -DSDL_STATIC=ON -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/SDL/build"
          cmake --install "$RUNNER_TEMP/SDL/build"

      - name: Put SDL3 on pkg-config's path
        run: |
          echo "PKG_CONFIG_PATH=$HOME/sdl3/lib/pkgconfig" >> "$GITHUB_ENV"
          PKG_CONFIG_PATH="$HOME/sdl3/lib/pkgconfig" pkg-config --modversion sdl3

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.4.2' # the build uses its bundled atlas

      # Safe here: CI has no bind-mounted libraries (never run Atlas locally).
      - name: Fetch dependencies (Atlas)
        run: atlas rep atlas.lock

      - name: Check the lock, nim.cfg and deps/ agree
        run: nim depsCheck

      # nimpretty has no check mode: format to a copy and fail on any diff.
      - name: Verify code formatting
        run: |
          shopt -s globstar nullglob
          status=0
          for f in src/**/*.nim tests/**/*.nim tools/**/*.nim; do
            out="$RUNNER_TEMP/fmt/$f"
            mkdir -p "$(dirname "$out")"
            nimpretty --indent:2 --maxLineLen:100 --out:"$out" "$f"
            diff -u "$f" "$out" || status=1
          done
          exit $status

      # The GUI tests open windows: tests/tester.nim starts an Xvfb server (Mesa
      # llvmpipe) for each test it runs, several at a time.
      - name: Run test suite (headless)
        run: nim test

      # The package's tests also run inside `nim test`; this is its own entry point,
      # so a break in how it runs alone (its folder, its config) shows up here.
      - name: Fetch parseSSDAT's own dependencies
        run: nim r tools/deps.nim sync --root:deps/parseSSDAT

      - name: Run the parseSSDAT tests alone
        run: nim parseSSDATTest

      - name: Fetch parseSSVIB's own dependencies
        run: nim r tools/deps.nim sync --root:deps/parseSSVIB

      - name: Run the parseSSVIB tests alone
        run: nim parseSSVIBTest

      # dist/viewSEG-<version>-linux-x64.tar.gz; packageTest also unpacks it and runs
      # the binary with --paths (no window, so no display needed).
      - name: Package (Linux)
        run: nim -d:packageTargets=linux packageTest

      - name: Upload the Linux package
        uses: actions/upload-artifact@v4
        with:
          name: viewSEG-linux-x64
          path: dist/viewSEG-*-linux-x64.tar.gz
          if-no-files-found: error

  # bin/viewSEG.exe cross-built with zig, as `nim winRelease` does in the
  # devcontainer: static SDL3 (tools/sdl3-windows.sh), no DLLs to ship; then
  # packaged with `nim package`.
  windows-exe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake ninja-build binutils

      # Keep in step with the nim-dev image's zig.
      - name: Set up zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Cache SDL3 for Windows
        uses: actions/cache@v4
        with:
          path: ~/.cache/viewSEG/sdl3-3.4.18-x86_64-windows-gnu
          key: sdl3-3.4.18-x86_64-windows-gnu-zig-0.17.1-v1

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.4.2'

      - name: Fetch dependencies (Atlas)
        run: atlas rep atlas.lock

      # Builds SDL3 first when the cache missed.
      - name: Build bin/viewSEG.exe
        run: nim winRelease

      # GUI subsystem, resources present, and only Windows system DLLs imported.
      - name: Check the executable
        run: |
          objdump -p bin/viewSEG.exe | tee "$RUNNER_TEMP/pe.txt" | grep -E 'Subsystem|DLL Name'
          grep -q 'Subsystem.*(Windows GUI)' "$RUNNER_TEMP/pe.txt"
          objdump -h bin/viewSEG.exe | grep -q '\.rsrc'
          if grep -iE 'DLL Name: .*(SDL|stdc\+\+|libgcc|winpthread|c\+\+)' "$RUNNER_TEMP/pe.txt"; then
            echo "unexpected DLL import"; exit 1
          fi

      # dist/viewSEG-<version>-windows-x64.zip around the same bin/viewSEG.exe
      # (rebuilt from the warm cache); packageTest checks the folder and the zip.
      - name: Package (Windows)
        run: nim -d:packageTargets=windows packageTest

      - name: Upload the Windows package
        uses: actions/upload-artifact@v4
        with:
          name: viewSEG-windows-x64
          path: dist/viewSEG-*-windows-x64.zip
          if-no-files-found: error

  # The test suite run on Windows itself, with MinGW gcc (preinstalled on the
  # runner): every test that needs no display (`--no-display`: `tests/utils/
  # displaytests` decides) and does not measure times (`--no-timing`), as one
  # program, one file after another (the runner's Windows mode). What it
  # checks that the Linux job cannot: paths, file names, renaming over and
  # deleting open files, file locks, the reference archive and the file
  # memory on NTFS, line ends. The window tests and the timing tests stay on
  # Linux: a runner has no display for the first, and its load is not steady.
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      # The runner's git converts line ends to CRLF on checkout. The documents
      # the tests compare with generated text, and the dependencies' own
      # (vendormaps/WRITING-A-MAP.md), must be as committed; this repository's
      # .gitattributes says LF too.
      - name: Keep line ends as committed
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.4.2'

      # Names what the runner has, so a change in its image shows here first.
      - name: Show the toolchain
        run: |
          gcc --version | head -n 1
          nim --version | head -n 1
          atlas --version
          git --version

      - name: Fetch dependencies (Atlas)
        run: atlas rep atlas.lock

      # An older run's Nim cache: only the files that changed are compiled again.
      - name: Cache the Nim build
        uses: actions/cache@v4
        with:
          path: nimcache-win
          key: nimcache-windows-${{ github.sha }}
          restore-keys: nimcache-windows-

      # No display: `--no-display`. Windows' one-process-at-a-time mode prints
      # each run's output as it goes, under a line that names the run.
      - name: Run the test suite (no display)
        run: >
          nim c -r --hints:off --nimcache:nimcache-win/tester tests/tester.nim
          --no-display --no-timing --timeout:900 --nimcache:nimcache-win/tests

      # The tests that measure times, apart and one at a time (the load of a
      # shared runner is what their bounds feel, so a failure here is read
      # with that in mind), among them the ones that matter most on Windows:
      # atomic writes over open files, the folder watcher, file locks, truncated
      # files. Those a file's own header marks `## Not on Windows:` stay out.
      - name: Run the tests that measure times (no display)
        if: ${{ !cancelled() }} # whether or not the first step passed: one run shows both
        run: >
          nim c -r --hints:off --nimcache:nimcache-win/tester tests/tester.nim
          --no-display --only-timing --timeout:900 --nimcache:nimcache-win/timing

  # bin/viewSEG.exe, the one `windows-exe` built, started on Windows. Agent
  # control does not exist there yet (the stdio bridge and `--mcp-call` say so
  # and exit), so a screenshot or a state read through it is not possible;
  # what is checked: the command line, the portable folders of the package, and
  # a window opened on a sample file and closed again.
  windows-run:
    runs-on: windows-latest
    needs: windows-exe
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the Windows package
        uses: actions/download-artifact@v4
        with:
          name: viewSEG-windows-x64
          path: pkg

      - name: Unpack it
        shell: pwsh
        run: |
          $zip = Get-ChildItem pkg -Filter 'viewSEG-*-windows-x64.zip' | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath app
          Get-ChildItem app -Recurse -Depth 1 | Select-Object -First 40 FullName

      # The program has the GUI subsystem: it prints only to a pipe or a file
      # it was given, so each call's output goes to a file first.
      - name: Command line
        shell: bash
        run: |
          exe=$(echo app/viewSEG-*-windows-x64/viewSEG.exe)
          "$exe" --version > out.txt 2> err.txt; echo "--version exit $?"; cat out.txt err.txt
          grep -q '^viewSEG [0-9]' out.txt
          "$exe" --paths > out.txt 2> err.txt; echo "--paths exit $?"; cat out.txt err.txt
          grep -q '^portable: yes' out.txt   # the package's config/ folder is there
          grep -q '^config: .*config' out.txt
          "$exe" --help > out.txt 2>&1; grep -q -- '--reset-windows' out.txt
          set +e
          echo '{}' | "$exe" --mcp-stdio > out.txt 2> err.txt; code=$?
          echo "--mcp-stdio exit $code"; cat err.txt
          [ "$code" = 1 ] || exit 1
          grep -q 'not available on Windows' err.txt || exit 1
          "$exe" --mcp-call state > out.txt 2> err.txt; code=$?
          echo "--mcp-call exit $code"; cat err.txt
          [ "$code" = 2 ] || exit 1

      # OpenGL 3 on a runner without a GPU: Mesa's software renderer (llvmpipe)
      # as opengl32.dll beside the program, from mesa-dist-win (the MinGW build:
      # the MSVC one ships no OpenGL), pinned by version and checksum.
      - name: Software OpenGL (Mesa llvmpipe)
        shell: bash
        env:
          MESA_VERSION: '26.2.7'
          MESA_SHA256: 19c74aad7b09e682473b8de4c35b47e6498de97b71cae5511a231b8eb02f2b22
        run: |
          curl -fsSL -o mesa.7z \
            "https://github.com/pal1000/mesa-dist-win/releases/download/$MESA_VERSION/mesa3d-$MESA_VERSION-release-mingw.7z"
          echo "$MESA_SHA256 *mesa.7z" | sha256sum -c -
          7z x -y -omesa mesa.7z > /dev/null
          gl=$(find mesa -ipath '*x64*' -iname opengl32.dll | head -n 1)
          [ -n "$gl" ] || { find mesa | head -n 60; echo "no x64/opengl32.dll in the Mesa archive"; exit 1; }
          dir=$(dirname "$gl")
          ls "$dir"
          for f in opengl32.dll libgallium_wgl.dll libdlclose-skip.dll dxil.dll; do
            [ -f "$dir/$f" ] && cp "$dir/$f" app/viewSEG-*-windows-x64/
          done
          ls app/viewSEG-*-windows-x64

      # Not yet a gate: a first run shows whether the runner's session gives a
      # window and llvmpipe an OpenGL 3 context; the log and a picture of the
      # screen are kept either way. Make it a gate once it has passed.
      - name: Open a file, close the window
        id: window
        continue-on-error: true
        shell: pwsh
        run: |
          $dir = (Resolve-Path 'app\viewSEG-*-windows-x64').Path
          $sample = (Resolve-Path 'samples\land\shots.sgy').Path
          $env:GALLIUM_DRIVER = 'llvmpipe'
          $env:MESA_GL_VERSION_OVERRIDE = '4.5'
          $p = Start-Process -FilePath "$dir\viewSEG.exe" -ArgumentList "`"$sample`"" `
            -WorkingDirectory $dir -PassThru
          Start-Sleep -Seconds 30
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($bounds.Location,
            [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("$PWD\screen.png")
          Get-ChildItem "$dir\logs" -ErrorAction SilentlyContinue | ForEach-Object {
            "--- $($_.Name)"; Get-Content $_.FullName -Tail 40 }
          if ($p.HasExited) { throw "viewSEG ended by itself, exit code $($p.ExitCode)" }
          $p.Refresh()
          if (-not $p.CloseMainWindow()) { $p.Kill(); throw "no main window to close" }
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw "did not end after its window was closed" }
          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }
          Get-ChildItem "$dir\config" | Select-Object Name, Length

      - name: Keep the screen and the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-run
          path: |
            screen.png
            app/viewSEG-*-windows-x64/logs
          if-no-files-found: ignore
