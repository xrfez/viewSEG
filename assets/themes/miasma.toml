# viewSEG theme: Miasma.
#
# Omarchy's miasma theme (its colors.toml in Omarchy 4.0.0.alpha), the colours
# unchanged. The palette: Miasma, by xero (xero/miasma.nvim, CC0 1.0). Where
# each theme comes from, and its licence: README.md in this folder; what each
# key does: everforest-dark.toml.
