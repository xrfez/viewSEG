# viewSEG theme: Everforest Light (sainnhe/everforest, light, medium contrast).
#
# A theme is an Omarchy colors.toml: any Omarchy theme's colors.toml dropped
# into a themes folder works as it is. To make your own, copy this file to
# <config>/themes/<name>.toml (`viewSEG --paths` shows <config>), change the
# colours, and pick it under View > Theme. See everforest-dark.toml for what
# each key is used for.
#
# Upstream names: background bg0, dark_background bg1, lighter_background bg2,
# selection bg3, darker_background bg4, muted bg5, dark_foreground grey0,
# light_foreground grey2. Brown has no upstream value (orange, lightened).
#
# Roles viewSEG moves in this theme, to keep it readable and its
# marks apart (README.md, "Readable in every theme"):
#   text, text_dim, active, accent, ok, warning, error, info, fill_negative, text_selection

name = "Everforest Light"
mode = "light"

accent = "#3a94c5"
selection = "#e6e2cc"
muted = "#bdc3af"

background = "#fdf6e3"
dark_background = "#f4f0d9"
darker_background = "#e0dcc7"
lighter_background = "#efebd4"

foreground = "#5c6a72"
dark_foreground = "#a6b0a0"
light_foreground = "#829181"
bright_foreground = "#5c6a72"

red = "#f85552"
yellow = "#dfa000"
orange = "#f57d26"
green = "#8da101"
cyan = "#35a77c"
blue = "#3a94c5"
magenta = "#df69ba"
brown = "#f9bc89"

bright_red = "#f85552"
bright_yellow = "#dfa000"
bright_green = "#8da101"
bright_cyan = "#35a77c"
bright_blue = "#3a94c5"
bright_magenta = "#df69ba"

[fonts]
ui = "JetBrainsMonoNerdFontPropo-Regular.ttf"
mono = "JetBrainsMonoNerdFontMono-Regular.ttf"
heading = "JetBrainsMonoNerdFontPropo-Bold.ttf"
size = 15
heading_size = 16

[metrics]
rounding = 6
frame_rounding = 4
border_width = 1
window_padding = 10
frame_padding_x = 8
frame_padding_y = 5
item_spacing_x = 8
item_spacing_y = 6
scrollbar_size = 12
