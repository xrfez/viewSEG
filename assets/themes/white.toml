# viewSEG theme: White.
#
# Omarchy's white theme (its colors.toml in Omarchy 4.0.0.alpha), the colours
# unchanged. The palette: an Omarchy theme by bjarneo (Omarchy's MIT). Where
# each theme comes from, and its licence: README.md in this folder; what each
# key does: everforest-dark.toml.
#
# Added in viewSEG's copy: `orange` and `brown`, which the file does not have,
# as viewSEG derives them (orange halfway between red and yellow, brown
# orange 55 % of the way to the background), so that it loads without a
# message.
#
# Roles viewSEG moves in this theme, to keep it readable and its
# marks apart (README.md, "Readable in every theme"):
#   text_dim, selection, hover, accent, highlight, ok, warning, info, receiver, flag_failed, flag_amplitude, flag_edited, flag_spread, text_selection

name = "White"
mode = "light"

accent = "#6e6e6e"
selection = "#c0c0c0"
muted = "#808080"

background = "#ffffff"
dark_background = "#f5f5f5"
darker_background = "#e8e8e8"
lighter_background = "#c0c0c0"

foreground = "#000000"
dark_foreground = "#c0c0c0"
light_foreground = "#000000"
bright_foreground = "#000000"

red = "#2a2a2a"
yellow = "#4a4a4a"
orange = "#3a3a3a"
green = "#3a3a3a"
cyan = "#3e3e3e"
blue = "#1a1a1a"
magenta = "#2e2e2e"
brown = "#a6a6a6"

bright_red = "#2a2a2a"
bright_yellow = "#4a4a4a"
bright_green = "#3a3a3a"
bright_cyan = "#3e3e3e"
bright_blue = "#1a1a1a"
bright_magenta = "#2e2e2e"
