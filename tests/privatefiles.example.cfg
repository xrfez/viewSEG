# Copy to exampleFiles/names.cfg and point each key at a local file of that
# kind. The real names stay in that untracked file; nothing here is a real
# survey. Lines are `key = path`, relative to exampleFiles/; # comments.

# SEG-D rev 3 shot record, one file, thousands of channels, a few auxiliary
# traces, stations that match landSps/landRps/landXps (a join finds most
# receivers).
landSegd = samples/land-record.sgd
# SPS 2.1 source file of that land survey: US survey feet (H20 feet, H201
# 0.3048006096), more than a thousand source points.
landSps = samples/land.sps
# The matching receiver file: more than a thousand receivers, same grid unit.
landRps = samples/land.rps
# The matching relation file: more than 100000 relation records.
landXps = samples/land.xps
# A SEG-D file of a few kilobytes, one short record (not opened by the suite).
smallSegd = samples/small.sgd
# A 3D SEG-Y volume in one file (binary header, trace headers, not a shot).
segy3d = samples/volume-3d.sgy
# A SEG-Y sweep pilot: an auxiliary sweep, not a shot record of seismic traces.
sweepSegy = samples/sweep-pilot.sgy
